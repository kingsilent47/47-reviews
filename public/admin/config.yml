backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "films"
    label: "Films"
    folder: "content/films"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Director", name: "director", widget: "string" }
      - { label: "Release Date", name: "release_date", widget: "string" }
      - { label: "Runtime", name: "runtime", widget: "string" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
      - { label: "Review Date", name: "date", widget: "date" }
      - { label: "Last Updated", name: "updated_date", widget: "date", required: false, hint: "Leave blank if not updated" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Content", name: "content", widget: "markdown" }
      - { label: "Pros", name: "pros", widget: "list", required: false }
      - { label: "Cons", name: "cons", widget: "list", required: false }
      - { label: "Verdict", name: "verdict", widget: "text", required: false }
      - { label: "Pull Quote", name: "pull_quote", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Check to pin this review to the top of the homepage" }

  - name: "music"
    label: "Music"
    folder: "content/music"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Release Date", name: "release_date", widget: "string" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Favorite Track", name: "favorite_track", widget: "string", required: false }
      - { label: "Least Favorite Track", name: "least_favorite_track", widget: "string", required: false }
      - { label: "Spotify Link", name: "spotify_link", widget: "string", required: false }
      - { label: "Apple Music Link", name: "apple_music_link", widget: "string", required: false }
      - { label: "YouTube Music Link", name: "youtube_music_link", widget: "string", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
      - { label: "Review Date", name: "date", widget: "date" }
      - { label: "Last Updated", name: "updated_date", widget: "date", required: false, hint: "Leave blank if not updated" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Content", name: "content", widget: "markdown" }
      - { label: "Verdict", name: "verdict", widget: "text", required: false }
      - { label: "Pull Quote", name: "pull_quote", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Check to pin this review to the top of the homepage" }

  - name: "games"
    label: "Games"
    folder: "content/games"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Developer", name: "developer", widget: "string" }
      - { label: "Platform", name: "platform", widget: "string" }
      - { label: "Release Date", name: "release_date", widget: "string" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Playtime", name: "playtime", widget: "string", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5 }
      - { label: "Review Date", name: "date", widget: "date" }
      - { label: "Last Updated", name: "updated_date", widget: "date", required: false, hint: "Leave blank if not updated" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Content", name: "content", widget: "markdown" }
      - { label: "Pros", name: "pros", widget: "list", required: false }
      - { label: "Pull Quote", name: "pull_quote", widget: "text", required: false }
      - { label: "Cons", name: "cons", widget: "list", required: false }
      - { label: "Verdict", name: "verdict", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Check to pin this review to the top of the homepage" }

  - name: "playlists"
    label: "Playlists"
    folder: "content/playlists"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Playlist Name", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Apple Music Link", name: "url", widget: "string" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", min: 0, step: 1, default: 0, hint: "Lower numbers appear first" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Currently Consuming"
        name: "status"
        file: "content/settings/status.json"
        fields:
          - { label: "Currently Watching (Film/TV)", name: "watching", widget: "string", required: false, hint: "e.g., Dune: Part Two" }
          - { label: "Currently Listening (Music)", name: "listening", widget: "string", required: false, hint: "e.g., Frank Ocean - Blond" }
          - { label: "Currently Playing (Games)", name: "playing", widget: "string", required: false, hint: "e.g., Elden Ring" }
