<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>47 Reviews - Honest Reviews of Films, Music, and Video Games</title>
  <meta name="description" content="A personal corner of the internet dedicated to thoughtful reviews of films, music, and video games. No clickbait, no inflated scores, just honest opinions.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- PWA Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  
  <!-- Apple iOS Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="47 Reviews">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
    
    <!-- Hidden form for Netlify Forms to detect -->
  <form name="review-request" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="review-request" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="requestType" />
    <input type="text" name="title" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
