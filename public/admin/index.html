<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | 47 Reviews</title>
  <style>
    /* --- 47 Reviews Admin Theme: Sharp, Monochromatic, No Fluff --- */
    :root {
      --ink: #1a1a1a;
      --paper: #fafafa;
      --border: #e5e5e5;
      --muted: #737373;
    }

    body {
      background-color: var(--paper) !important;
      font-family: system-ui, -apple-system, sans-serif !important;
      color: var(--ink) !important;
    }

    /* 1. THE GOLDEN RULE: NO ROUNDED CORNERS ANYWHERE */
    * {
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* 2. SIDEBAR NAVIGATION */
    aside {
      background-color: #ffffff !important;
      border-right: 1px solid var(--border) !important;
    }
    
    aside a, [class*="SidebarNavItem"] {
      color: var(--muted) !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      font-size: 0.75rem !important;
      border-left: 3px solid transparent !important;
      padding-left: 1.5rem !important;
      transition: all 0.2s ease !important;
    }
    
    aside a:hover, aside a.active, [class*="SidebarNavItem"][aria-current="page"] {
      color: var(--ink) !important;
      background-color: #f5f5f5 !important;
      border-left: 3px solid var(--ink) !important;
    }

    /* 3. TOP HEADER BAR */
    header, [class*="TopBar"] {
      background-color: #ffffff !important;
      border-bottom: 1px solid var(--border) !important;
    }

    /* 4. BUTTONS (Sharp & Editorial) */
    button {
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      font-size: 0.75rem !important;
      transition: all 0.2s ease !important;
      cursor: pointer !important;
    }

    /* Primary Buttons (Publish, Save, Add New) */
    button[class*="Primary"], button[type="submit"], button[class*="Add"] {
      background-color: var(--ink) !important;
      color: #ffffff !important;
      border: 1px solid var(--ink) !important;
    }

    button[class*="Primary"]:hover, button[type="submit"]:hover {
      background-color: #333333 !important;
      border-color: #333333 !important;
    }

    /* Secondary Buttons */
    button:not([class*="Primary"]):not([type="submit"]) {
      background-color: transparent !important;
      color: var(--ink) !important;
      border: 1px solid var(--border) !important;
    }

    button:not([class*="Primary"]):not([type="submit"]):hover {
      border-color: var(--ink) !important;
      background-color: #f5f5f5 !important;
    }

    /* 5. FORM INPUTS & TEXTAREAS */
    input, textarea, select {
      border: 1px solid var(--border) !important;
      background-color: #ffffff !important;
      color: var(--ink) !important;
      transition: border-color 0.2s ease !important;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--ink) !important;
      outline: 2px solid var(--ink) !important;
      outline-offset: -2px !important;
    }

    /* 6. MARKDOWN EDITOR TOOLBAR */
    [class*="Toolbar"] {
      background-color: #f5f5f5 !important;
      border: 1px solid var(--border) !important;
      border-bottom: none !important;
    }

    [class*="Toolbar"] button {
      color: var(--muted) !important;
    }
    
    [class*="Toolbar"] button:hover {
      color: var(--ink) !important;
      background-color: #e5e5e5 !important;
    }

    [class*="Textarea"] {
      border: 1px solid var(--border) !important;
      border-top: none !important;
    }

    /* 7. LOGIN PAGE SPECIFICS */
    [class*="Login"] {
      background-color: var(--paper) !important;
    }
    
    [class*="Login"] [class*="Card"] {
      border: 1px solid var(--border) !important;
    }

    [class*="Login"] h1 {
      font-family: 'Georgia', 'Times New Roman', serif !important;
      font-weight: 700 !important;
      letter-spacing: -0.02em !important;
    }
  </style>
</head>
<body>
  <!-- Include the script that enables Netlify Identity on the page -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Include the Decap CMS script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
